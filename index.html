<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매쓰헌터 검수 결과</title><script defer src="data.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#18283c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14263d;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header small{color:#b7ddd5}main{max-width:1220px;margin:44px auto;padding:0 24px}h1{font-size:32px;margin-bottom:12px}.intro{color:#516379;line-height:1.8}.stats{display:flex;gap:16px;margin:25px 0}.stat{background:white;padding:18px 25px;border:1px solid #e0e7ef;border-radius:12px;flex:1}.stat b{font-size:30px;display:block;margin-top:4px}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:white;padding:20px;border-radius:12px;margin:24px 0}label{display:grid;gap:6px;font-size:13px;color:#516379}select,input,button{font:inherit;border:1px solid #cbd5e1;padding:10px;border-radius:7px;background:white;color:#18283c}button{cursor:pointer}input{min-width:230px}.card{background:white;margin:20px 0;padding:24px;border:1px solid #e0e7ef;border-radius:14px}.head{display:flex;justify-content:space-between;gap:15px}.head h2{font-size:20px;margin:0 0 7px}.meta{font-size:13px;color:#65758a}.tag{align-self:start;border-radius:20px;background:#e1f5ef;color:#176652;padding:7px 12px;font-size:13px;white-space:nowrap}.tag.pending{background:#fff1d4;color:#865a12}.summary{line-height:1.75;background:#f4f7fb;padding:15px;border-radius:8px}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;min-width:0}figcaption{font-size:14px;font-weight:700;margin:12px 0}img{display:block;width:100%;height:auto;background:#fafafa;border:1px solid #e4e9ef;border-radius:8px}a{color:#205b9e}footer{font-size:12px;line-height:1.8;color:#65758a;margin:35px 0}.empty{padding:40px;text-align:center;color:#65758a}.notice{font-size:13px;color:#65758a}.pager{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #59b5a6;outline-offset:2px}@media(max-width:700px){main{padding:0 15px;margin-top:25px}.pictures{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:23px}.head{flex-direction:column}.filters label{flex:1}input{min-width:160px}h1{font-size:27px}}
</style></head><body><header><strong>MATH HUNTER · CONTENT REVIEW</strong><small>조회 전용</small></header><main><h1>매쓰헌터 검수 결과</h1><p class="intro">문제와 해설을 함께 살펴보고, 개선 내용과 처리 상태를 확인할 수 있습니다.</p><p class="notice">검수 기록 기준일: <span id="date"></span> · 이미지는 현재 운영 서버에서 불러옵니다. 기록과 이미지의 시점이 다를 수 있습니다.</p><section class="stats" aria-label="검수 현황"><div class="stat">등록 문항<b id="total"></b></div><div class="stat">처리 완료<b id="done"></b></div><div class="stat">후속 검토<b id="pending"></b></div></section><section class="filters" aria-label="검색 필터"><label>처리 상태<select id="status"><option value="active" selected>처리 완료 제외</option><option value="all">전체</option><option value="completed">처리 완료</option><option value="pending">검토 대기</option><option value="correction">수정 제안</option><option value="optional">선택적 표현 개선</option><option value="uncertain">판단 보류</option></select></label><label>학년<select id="grade"><option value="">전체 학년</option></select></label><label>학기<select id="semester"><option value="">전체 학기</option><option value="1">1학기</option><option value="2">2학기</option></select></label><label>검색<input id="search" type="search" placeholder="문항 번호, 단원, 개선 내용"></label><button id="reset" type="button">초기화</button></section><p id="count" class="meta" aria-live="polite"></p><section id="cards" aria-label="검수 결과 목록"></section><nav class="pager" aria-label="페이지 이동"><button id="prev" type="button">이전</button><span id="page"></span><button id="next" type="button">다음</button></nav><footer>처리 완료에는 수정 반영과 수정 불필요 판단이 포함됩니다. 이 화면에서는 승인·정답·힌트·검수 상태를 변경할 수 없습니다.<br>콘텐츠의 저작권은 각 권리자에게 있습니다.</footer></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const $=id=>document.getElementById(id),data=window.REVIEW_DATA,rows=data.records;let page=0;const size=12;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 $('date').textContent=data.date;$('total').textContent=rows.length;$('done').textContent=rows.filter(r=>r.state==='completed').length;$('pending').textContent=rows.filter(r=>r.state!=='completed').length;
 for(const g of [...new Set(rows.map(r=>r.grade))].sort()){const o=document.createElement('option');o.value=g;o.textContent=g+'학년';$('grade').append(o);}
 function render(){const query=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>($('status').value==='all'||($('status').value==='active'&&r.state!=='completed')||r.state===$('status').value)&&(!$('grade').value||String(r.grade)===$('grade').value)&&(!$('semester').value||String(r.semester)===$('semester').value)&&(!query||[r.code,r.index,r.unitTitle,r.lessonTitle,r.summary].join(' ').toLowerCase().includes(query)));const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('count').textContent=filtered.length+'개 문항';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
 $('cards').innerHTML=filtered.slice(page*size,(page+1)*size).map(r=>`<article class="card"><div class="head"><div><h2>${esc(r.code)} · ${esc(r.unitTitle)}</h2><div class="meta">${r.grade}학년 ${r.semester}학기 · ${esc(r.lessonTitle)}</div></div><span class="tag ${r.state}">${esc(({completed:'처리 완료',pending:'검토 대기',correction:'수정 제안',optional:'선택적 표현 개선',uncertain:'판단 보류'})[r.state])}</span></div><p class="summary">${esc(r.summary)}</p><div class="pictures">${[['q','문제'],['a','해설']].map(([key,label])=>`<figure><figcaption>${label}</figcaption><a href="${esc(r[key])}" target="_blank" rel="noopener noreferrer" aria-label="${esc(r.code)} ${label} 크게 보기"><img loading="lazy" src="${esc(r[key])}" alt="${esc(r.code)} ${label}"></a></figure>`).join('')}</div></article>`).join('')||'<p class="empty">검색 조건에 맞는 문항이 없습니다.</p>';
 for(const img of $('cards').querySelectorAll('img'))img.addEventListener('error',()=>{const p=document.createElement('p');p.className='notice';p.textContent='이미지를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.';img.replaceWith(p);},{once:true});}
 for(const id of ['status','grade','semester','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('reset').onclick=()=>{$('status').value='active';$('grade').value='';$('semester').value='';$('search').value='';page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};const params=new URLSearchParams(location.search);for(const id of ['grade','semester','status','search'])if(params.has(id))$(id).value=params.get(id);render();
});
</script></body></html>
